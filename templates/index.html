<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Symbol Table File Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .upload-box {
            border: 2px dashed #10d8c7;
            border-radius: 12px;
            padding: 30px;
            background: #ffffff;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-box:hover {
            background: #f0f7ff;
        }
        .title-text {
            font-weight: 700;
            color: #10d8c7;
        }
        .subtitle-text {
            color: #6c757d;
        }
        .footer-text {
            font-size: 13px;
            color: #6c757d;
        }
        .btn-aqua{
            color: #000000;
            background-color: #10d8c7;
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg p-4">
                <h2 class="text-center title-text">Symbol Table Converter Tool</h2>
                <p class="text-center subtitle-text">
                    Upload your <b>Symbol Table in .ASC format </b>and generate formatted <b>TXT</b> + <b>Excel</b> reports.
                </p>

                <form method="POST" enctype="multipart/form-data">
                    <label class="upload-box w-100">
                        <input type="file" name="ascfile" accept=".asc" required hidden>
                        <h5 class="mb-2">📂 Click to Upload Symbol Table</h5>
                        <p class="mb-0 subtitle-text">Supported Format: .asc</p>
                    </label>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-aqua btn-lg">
                             Upload & Generate Report
                        </button>
                    </div>
                </form>

                {% if txt_ready %}
                <hr class="my-4">

                <h5 class="text-center text-success">✅ Report Generated Successfully!</h5>

                <div class="d-flex justify-content-center gap-3 mt-3">
                    <a href="/download/txt" class="btn btn-outline-dark btn-lg">
                        📄 Download TXT
                    </a>
                    <a href="/download/excel" class="btn btn-success btn-lg">
                        📊 Download Excel
                    </a>
                </div>
                {% endif %}

                <hr class="my-4">

                <p class="text-center footer-text">
                    Developed for Symbol Table Conversion | Tanishq
                </p>
            </div>

        </div>
    </div>
</div>

</body>
</html>
